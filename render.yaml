services:
  - type: web
    name: hsg-mt-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - fromGroup: hsg-mt-production

  - type: worker
    name: hsg-mt-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - fromGroup: hsg-mt-production

  - type: web
    name: hsg-mt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.17.1
      - key: VITE_API_URL
        sync: false
